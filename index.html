const byId=id=>document.getElementById(id);
const screen=byId("screen");

const emotions=Object.keys(words);
const lessons=[
 ["Старт",4,"Поздоровайтесь: Hello, everyone! Покажите остров и четыре мордочки. Спросите: How do you feel today? Можно выбрать любую эмоцию, пропустить личный ответ или выбрать настроение персонажа. Объясните, что все чувства бывают у людей."],
 ["Слова",6,"Нажмите каждую карточку: happy, sad, angry, tired. Класс повторяет хором, затем показывает выражение лица. Попросите 2–3 добровольцев изобразить персонажа. Повторите слова в другом порядке."],
 ["На слух",6,"Шесть оригинальных звуковых подсказок на тему страницы 39. Включайте запись по кнопке и предложите всем выбрать картинку или номер пальцами. Каждый раз другой ученик отвечает у доски. Это отдельное аудирование, поэтому порядок ответов не нужно переносить в упражнение учебника без его аудиозаписи."],
 ["Мультфильм",6,"Запустите короткую анимированную историю с четырьмя эпизодами. Обсудите, что происходит. Затем нажмите «Играть в угадайку», чтобы дети сопоставляли ситуацию с эмоцией. В реальной жизни один человек может чувствовать по-разному."],
 ["Музыка",5,"Запустите авторскую ритмическую речёвку. Дети слушают и повторяют строки, хлопают, машут рукой, спокойно дышат и изображают сон. Повторите один раз. Можно выполнять сидя. Это новая речёвка к теме урока."],
 ["В парах",5,"Покажите образец диалога A: How do you feel? B: I am happy. В парах один ученик показывает эмоцию, другой задаёт вопрос. Затем меняются. Можно использовать любую из четырёх вымышленных эмоций."],
 ["Мастерская",9,"На бумаге нарисуйте лицо или маску с выбранным выражением и подпишите I am ... . На доске можно показать пример и нарисовать лицо пальцем. Попросите ребёнка показать рисунок соседу, а 2–3 желающих — классу."],
 ["Финал",4,"Каждый ученик записывает два английских слова по картинкам и заканчивает фразу I am ... . После выполнения откройте ответы. По 1 баллу за каждый ответ, всего 3. Затем поблагодарите класс: Great job!"]
];
const quiz=[["clue0","happy"],["clue1","sad"],["clue2","angry"],["clue3","tired"],["clue4","happy"],["clue5","sad"]];
const scenes=[["gift","happy","A gift!","Персонаж получает подарок."],["balloon","sad","Oh no! My balloon!","Шарик лопнул."],["toy","angry","My toy is broken!","Любимая игрушка сломалась."],["moon","tired","Good night!","Уже поздно, пора спать."]];
const chants=[["happy","I am happy!","Clap, clap, clap!","Хлопаем в ладоши."],["sad","I am sad.","Give a little wave.","Машем рукой."],["angry","I am angry.","Breathe in, breathe out.","Спокойно делаем вдох и выдох."],["tired","I am tired.","Close your eyes.","Изображаем сон."]];
const initial=()=>({step:0,remaining:240,deadline:null,effects:true,earned:new Set(),quiz:0,answer:false,misses:new Set(),movie:0,moviePlaying:false,movieEnded:false,storyMode:false,storyAnswer:false,storyMiss:"",chant:0,chantPlaying:false,chantEnded:false,pair:0,exit:false,done:false,color:"#302d57"});
const state=initial();
let animationTimer=0,movieVoiceTimer=0,chantTimer=0;
let drawingImage=null;
let audioContext,voiceSource,voiceRequest=0;
const voicePlayer=byId("voicePlayer"),audioBuffers=new Map();
function voiceStatus(message){byId("voiceStatus").textContent=message;byId("voiceControls").hidden=!message&&voicePlayer.hidden;}
function stopVoice(){voiceRequest++;if(voiceSource){try{voiceSource.stop()}catch{} voiceSource=null;}voicePlayer.pause();voicePlayer.hidden=true;voiceStatus("");}
function getContext(){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error("No audio context");audioContext ||=new C();return audioContext;}
async function playVoice(key){
 stopVoice();const request=voiceRequest;const encoded=clips[key];if(!encoded)return;voiceStatus("♪ Слушаем…");
 let timer;
 try{
   const context=getContext();
   const resumed=context.state==="running"?Promise.resolve():context.resume();
   let cached=audioBuffers.get(key);
   if(!cached){cached=context.decodeAudioData(Uint8Array.from(atob(encoded),c=>c.charCodeAt(0)).buffer);audioBuffers.set(key,cached);cached.catch(()=>audioBuffers.delete(key));}
   const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error("audio timeout")),1500);});
   const [,buffer]=await Promise.race([Promise.all([resumed,cached]),timeout]);
   if(request!==voiceRequest)return;
   if(context.state!=="running")throw Error("Audio suspended");
   const node=context.createBufferSource();node.buffer=buffer;node.connect(context.destination);node.onended=()=>{node.disconnect();if(request===voiceRequest){voiceSource=null;voiceStatus("");}};node.start();voiceSource=node;
 }catch{
   if(request!==voiceRequest)return;
   voicePlayer.src="data:audio/mpeg;base64,"+encoded;
   try{await voicePlayer.play()}catch{if(request!==voiceRequest)return;voicePlayer.controls=true;voicePlayer.hidden=false;voiceStatus("Нажми ▶ на плеере. Можно открыть файл в Chrome или Edge.");}
 }finally{clearTimeout(timer);}
}
voicePlayer.addEventListener("ended",()=>{if(voicePlayer.hidden)voiceStatus("")});
function tone(frequency,delay=0,duration=.15,volume=.045){
 try{const c=getContext();if(c.state==="suspended")c.resume().catch(()=>{});const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=frequency;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(c.destination);o.start(t);o.stop(t+duration+.02);}catch{}
}
function effect(good){if(!state.effects)return;(good?[523,659,784]:[330,294]).forEach((f,i)=>tone(f,i*.10));}
function earn(key){state.earned.add(key);byId("stars").textContent="★ "+state.earned.size;}
const title=(en,ru)=>`<h1 id="heading" lang="en" tabindex="-1">${en}</h1><p class="intro">${ru}</p>`;
function stopAnimations(){clearTimeout(animationTimer);clearTimeout(movieVoiceTimer);clearTimeout(chantTimer);state.moviePlaying=false;state.chantPlaying=false;stopVoice();}
function notify(message){byId("systemMessage").textContent=message;byId("systemMessage").hidden=!message;}
function updateTimer(){if(state.deadline!==null){state.remaining=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));if(state.remaining===0)state.deadline=null;}
 const t=Math.floor(state.remaining/60)+":"+String(state.remaining%60).padStart(2,"0");
 byId("timerButton").textContent=t+" · "+(state.deadline!==null?"Пауза":state.remaining?"Пуск":"Заново");
}
function go(index){stopAnimations();if(state.step===6)saveDrawing();state.step=index;state.remaining=lessons[index][1]*60;state.deadline=null;byId("notes").open=false;notify("");render();byId("heading").focus({preventScroll:true});}
function render(){const start=lessons.slice(0,state.step).reduce((sum,l)=>sum+l[1],0);byId("lessonRoute").innerHTML=lessons.map(([name,min],index)=>`<button data-stage="${index}" ${index===state.step&&!state.done?'aria-current="step"':""}><span class="marker">${index+1}</span><span>${name}</span><small>${min} мин</small></button>`).join("");byId("stageIndex").textContent=state.done?"Урок завершён":`Этап ${state.step+1}/8`;byId("stageTime").textContent=state.done?"45 мин":`${start}–${start+lessons[state.step][1]} мин`;byId("stars").textContent="★ "+state.earned.size;byId("progress").style.width=(state.done?100:start/45*100)+"%";byId("timerButton").hidden=state.done;byId("back").disabled=!state.done&&state.step===0;byId("next").textContent=state.done?"Сыграть снова ↻":state.step===7?"Завершить урок ✓":state.step===0?"На остров! →":"Дальше →";byId("notes").hidden=state.done;byId("teacherNotes").innerHTML=`<p>${lessons[state.step][2]}</p>`;updateTimer();renderScreen();}
function welcome(){return `<div class="hero"><div class="hero-copy"><div class="tag">3 CLASS · LESSON 8 · PAGE 39</div><h1 id="heading" lang="en" tabindex="-1">Feelings Island</h1><p class="intro">Остров эмоций</p><strong lang="en">How do you feel?</strong><p>Познакомься с четырьмя героями, послушай их и сыграй вместе с классом!</p><div class="actions">${speak("hello","Послушать приветствие","gold")}</div></div><div class="land">${emotions.map(e=>art(e,"float")).join("")}</div></div>`;}
function vocab(){return title("Meet the feelings!","Нажми на героя, послушай слово и покажи его мимику.")+`<div class="characters">${emotions.map(e=>`<button class="card" data-speak="${e}" style="--tint:${words[e].tint};--border:${words[e].border}">${art(e)}<strong lang="en">${e}</strong><small>${words[e].ru}</small><span class="listen-label">${icon("speaker")} Слушать</span></button>`).join("")}</div><p class="intro" style="margin:14px 0 0" lang="en">Show me a happy face!</p>`;}
function listening(){const [sound,answer]=quiz[state.quiz];return title("Sound detective","Послушай голос и угадай чувство. Выбери одного из героев.")+`<div class="listen-panel"><div><span class="round">Звук ${state.quiz+1} / 6</span><br><b>What do you hear?</b></div>${speak(sound,"Слушать звук","primary")}</div><div class="options">${emotions.map((e,i)=>`<button class="option ${state.answer&&e===answer?"good":!state.answer&&state.misses.has(e)?"wrong":""}" data-answer="${e}" style="--tint:${words[e].tint};--border:${words[e].border}" ${state.answer?"disabled":""}>${art(e)}<strong>${state.answer&&e===answer?"✓ "+e:i+1}</strong></button>`).join("")}</div><div class="actions" style="justify-content:space-between"><p class="feedback ${!state.answer&&state.misses.size?"bad":""}" role="status">${state.answer?`Great! I am ${answer}.`:state.misses.size?"Try again! Послушай ещё раз.":" "}</p>${state.answer?`<button class="primary" data-action="next-quiz">${state.quiz===5?"Повторить игру ↻":"Следующий звук →"}</button>`:""}</div>`;}
function movie(){const [prop,emotion,en,ru]=scenes[state.movie];const reveal=!state.storyMode||state.storyAnswer;return title(state.storyMode?"Guess the feeling!":"Mini movie","Посмотри короткую мультяшную сценку. Как может чувствовать себя герой?")+`<div class="video-banner"><span class="pill">🎬 Сцена ${state.movie+1}/4</span>${state.storyMode?`<button class="secondary" data-action="watch-mode">Смотреть мультфильм</button>`:`<button class="gold" data-action="movie-toggle">${state.moviePlaying?"❚❚ Пауза":state.movieEnded?"▶ Смотреть снова":"▶ Смотреть мультфильм"}</button>`}</div><div class="scene">${art(reveal?emotion:"mystery","actor")}${art(prop,"prop")}<div class="scene-copy"><b lang="en">${en}</b><p>${ru}</p>${reveal?`<p><b lang="en">I am ${emotion}.</b></p>`:""}</div></div>${state.storyMode?`<div class="actions" style="margin-top:10px">${speak("story"+state.movie,"Слушать сценку")}</div><div class="word-options">${emotions.map(e=>`<button class="word-choice ${state.storyAnswer&&e===emotion?"good":state.storyMiss===e?"wrong":""}" data-story="${e}" ${state.storyAnswer?"disabled":""}>${e}</button>`).join("")}</div><div class="actions" style="justify-content:space-between"><p class="feedback ${state.storyMiss?"bad":""}" role="status">${state.storyAnswer?"Well done!":state.storyMiss?"Try another feeling!":" "}</p>${state.storyAnswer?`<button class="primary" data-action="next-story">${state.movie===3?"Повторить ↻":"Следующая сценка →"}</button>`:""}</div>`:`<div class="actions" style="margin-top:12px">${speak("i"+emotion,"Слушать фразу")}<button class="secondary" data-action="next-scene">Другая сценка →</button><button class="primary" data-action="story-mode">Играть в угадайку →</button></div>`}`;}
function chant(){const [emotion,line,motion,ru]=chants[state.chant];return title("Feelings chant!","Слушай ритмичную речёвку. Повторяй слова и движения в своём темпе.")+`<div class="chant-stage">${art(emotion)}<div><span class="pill">♪ ${state.chant+1}/4</span><p class="chant-text" lang="en">${line}</p><p class="chant-text" lang="en">${motion}</p><p class="chant-instruction">${ru}</p></div></div><div class="actions" style="margin-top:13px"><button class="gold" data-action="chant-toggle">${state.chantPlaying?"❚❚ Пауза":state.chantEnded?"▶ Повторить речёвку":"▶ Начать речёвку"}</button>${speak("chant"+state.chant,"Повторить строку")}<button class="secondary" data-action="next-chant">Другое движение →</button></div>`;}
function partners(){const e=emotions[state.pair];return title("How do you feel?","Работайте в парах. Один спрашивает, другой показывает героя и отвечает.")+`<div class="partner"><div class="speech"><small>Ученик A</small><b lang="en">How do you feel?</b>${speak("question")}</div><div class="speech">${art(e,"character")}<small>Ученик B</small><b lang="en">I am ${e}.</b>${speak("i"+e)}</div></div><div class="actions" style="margin-top:14px"><button class="gold" data-action="pair">Другая эмоция →</button><p class="intro" style="margin:0">Теперь поменяйтесь ролями!</p></div>`;}
function drawing(){return title("Make a feelings face!","Нарисуй лицо на бумаге или попробуй сделать рисунок на экране.")+`<div class="artwork"><div class="studio"><div class="canvas-wrap"><canvas id="drawCanvas" width="600" height="360" aria-label="Поле для рисунка"></canvas></div><div class="colors" aria-label="Цвет карандаша">${["#302d57","#df6b69","#f3b63e","#479dc9","#8d5fbd","#43a075"].map(c=>`<button class="color-picker" aria-label="Цвет ${c}" aria-pressed="${c===state.color}" data-color="${c}" style="background:${c}"></button>`).join("")}<button class="secondary" data-action="clear-drawing">Очистить</button></div></div><div class="steps"><h2>Draw &amp; show</h2><div class="step-row"><strong>1</strong><p>Нарисуй глаза и рот. Выбери настроение.</p></div><div class="step-row"><strong>2</strong><p>Напиши под рисунком <b lang="en">I am happy.</b> или другую фразу.</p></div><div class="step-row"><strong>3</strong><p>Покажи рисунок другу. Он угадает чувство.</p></div><div class="actions">${emotions.map(e=>`<button class="light" data-stamp="${e}" lang="en">${e}</button>`).join("")}</div></div></div>`;}
function exitTicket(){return title("You did it!","Самостоятельно напиши два слова и закончи одну фразу.")+`<div class="exit-grid"><article class="exit-card">${art("tired")}<h2>1. ____</h2></article><article class="exit-card">${art("angry")}<h2>2. ____</h2></article><article class="exit-card"><h2>3. Make a sentence</h2><p style="font-size:2rem;font-weight:bold" lang="en">I am ____.</p><p>Выбери любую эмоцию.</p></article></div><div class="actions" style="margin-top:14px"><button class="gold" data-action="exit">${state.exit?"Скрыть ответы":"Показать ответы"}</button></div><div class="pale" style="margin-top:13px" ${state.exit?"":"hidden"}><b lang="en">1. tired · 2. angry · 3. I am happy. (or sad, angry, tired)</b></div>`;}
const views=[welcome,vocab,listening,movie,chant,partners,drawing,exitTicket];
function renderScreen(){screen.innerHTML=state.done?`<div class="complete">${art("star","float")}<h1 id="heading" tabindex="-1" lang="en">Great job!</h1><p>Вы познакомились с четырьмя чувствами!</p><p><b lang="en">Goodbye!</b></p><p>★ Звёзды класса: ${state.earned.size}</p></div>`:views[state.step]();if(state.step===6&&!state.done)initCanvas();}
function refresh(selector){renderScreen();const target=selector&&screen.querySelector(selector);if(target&&!target.disabled)target.focus({preventScroll:true});}
function runMovie(){
 if(!state.moviePlaying)return;
 playVoice("story"+state.movie);
 movieVoiceTimer=setTimeout(()=>{if(state.moviePlaying&&state.step===3)playVoice("i"+scenes[state.movie][1]);},2400);
 animationTimer=setTimeout(()=>{if(!state.moviePlaying||state.step!==3)return;if(state.movie===3){state.moviePlaying=false;state.movieEnded=true;earn("movie");refresh('[data-action="story-mode"]');return;}state.movie++;refresh();runMovie();},5500);
}
function runChant(){if(!state.chantPlaying)return;playVoice("chant"+state.chant);if(state.effects){tone(523,0,.11,.025);tone(659,.48,.11,.025);tone(784,.96,.11,.025);tone(659,1.44,.11,.025);}chantTimer=setTimeout(()=>{if(!state.chantPlaying||state.step!==4)return;if(state.chant===3){state.chantPlaying=false;state.chantEnded=true;earn("chant");refresh();return;}state.chant++;refresh();runChant();},4500);}
function saveDrawing(){const canvas=byId("drawCanvas");if(canvas)drawingImage=canvas.toDataURL();}
function defaultFace(canvas){const c=canvas.getContext("2d");c.clearRect(0,0,canvas.width,canvas.height);c.fillStyle="#fffdf7";c.fillRect(0,0,canvas.width,canvas.height);c.strokeStyle="#dfd5f4";c.lineWidth=5;c.setLineDash([10,9]);c.beginPath();c.ellipse(300,180,139,139,0,0,Math.PI*2);c.stroke();c.setLineDash([]);}
function initCanvas(){const canvas=byId("drawCanvas");if(!canvas)return;const c=canvas.getContext("2d");defaultFace(canvas);if(drawingImage){const img=new Image();img.onload=()=>{if(canvas===byId("drawCanvas"))c.drawImage(img,0,0)};img.src=drawingImage;}let active=false;const pt=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];};canvas.addEventListener("pointerdown",e=>{active=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pt(e);c.strokeStyle=state.color;c.fillStyle=state.color;c.lineWidth=8;c.lineCap="round";c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y+.1);c.stroke();});canvas.addEventListener("pointermove",e=>{if(!active)return;const [x,y]=pt(e);c.lineTo(x,y);c.stroke();});const end=()=>{if(active){active=false;saveDrawing();earn("craft");}};canvas.addEventListener("pointerup",end);canvas.addEventListener("pointercancel",end);}
function drawFace(emotion){const canvas=byId("drawCanvas");const c=canvas.getContext("2d");defaultFace(canvas);c.strokeStyle=state.color;c.fillStyle=state.color;c.lineWidth=8;c.lineCap="round";c.beginPath();c.ellipse(300,180,139,139,0,0,Math.PI*2);c.stroke();const eye=(x,y)=>{c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.fill();};if(emotion==="tired"){c.beginPath();c.moveTo(235,145);c.quadraticCurveTo(250,160,266,145);c.moveTo(334,145);c.quadraticCurveTo(350,160,366,145);c.stroke();c.beginPath();c.ellipse(300,215,19,25,0,0,Math.PI*2);c.stroke();}else{eye(250,150);eye(350,150);c.beginPath();c.moveTo(240,220);c.quadraticCurveTo(300,emotion==="happy"?290:165,360,220);c.stroke();if(emotion==="angry"){c.beginPath();c.moveTo(230,120);c.lineTo(270,135);c.moveTo(370,120);c.lineTo(330,135);c.stroke();}if(emotion==="sad"){c.beginPath();c.moveTo(365,172);c.quadraticCurveTo(349,195,365,199);c.quadraticCurveTo(380,194,365,172);c.fill();}}saveDrawing();playVoice("i"+emotion);earn("craft");}
byId("lessonRoute").addEventListener("click",e=>{const b=e.target.closest("[data-stage]");if(b){state.done=false;go(Number(b.dataset.stage));}});
byId("next").addEventListener("click",()=>{if(state.done){stopAnimations();const effects=state.effects;Object.assign(state,initial(),{effects});drawingImage=null;go(0);}else if(state.step===7){stopAnimations();state.done=true;state.deadline=null;effect(true);render();}else go(state.step+1);});
byId("back").addEventListener("click",()=>{const s=state.done?7:Math.max(0,state.step-1);state.done=false;go(s);});
byId("timerButton").addEventListener("click",()=>{updateTimer();if(state.deadline!==null)state.deadline=null;else{if(!state.remaining)state.remaining=lessons[state.step][1]*60;state.deadline=Date.now()+state.remaining*1000;}updateTimer();});
setInterval(()=>{if(state.deadline!==null)updateTimer();},250);
byId("soundButton").addEventListener("click",()=>{state.effects=!state.effects;const b=byId("soundButton");b.setAttribute("aria-pressed",String(state.effects));b.querySelector("use").setAttribute("href",state.effects?"#speaker":"#mute");if(state.effects)effect(true);});
byId("fullButton").addEventListener("click",async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else notify("Используй полноэкранный режим браузера.");}catch{notify("Используй полноэкранный режим браузера.");}});
screen.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const {speak:key,answer,story,action,color,stamp}=b.dataset;
 if(key){if(state.moviePlaying||state.chantPlaying){stopAnimations();refresh();}if(b.classList.contains("card")){screen.querySelector(".playing")?.classList.remove("playing");b.classList.add("playing");earn("word-"+key);}playVoice(key);return;}
 if(answer){stopVoice();state.answer=answer===quiz[state.quiz][1];if(state.answer)earn("quiz-"+state.quiz);else state.misses.add(answer);effect(state.answer);refresh(state.answer?'[data-action="next-quiz"]':"[data-speak]");return;}
 if(story){state.storyAnswer=story===scenes[state.movie][1];state.storyMiss=state.storyAnswer?"":story;if(state.storyAnswer)earn("story-"+state.movie);effect(state.storyAnswer);refresh();return;}
 if(color){state.color=color;screen.querySelectorAll("[data-color]").forEach(el=>el.setAttribute("aria-pressed",String(el.dataset.color===color)));return;}
 if(stamp){drawFace(stamp);return;}
 switch(action){
 case "next-quiz":stopVoice();state.quiz=(state.quiz+1)%quiz.length;state.answer=false;state.misses.clear();refresh("[data-speak]");break;
 case "movie-toggle":if(state.moviePlaying){stopAnimations();refresh();}else{if(state.movieEnded){state.movie=0;state.movieEnded=false;}state.moviePlaying=true;refresh();runMovie();}break;
 case "next-scene":stopAnimations();state.movie=(state.movie+1)%scenes.length;state.movieEnded=false;refresh();playVoice("i"+scenes[state.movie][1]);break;
 case "story-mode":stopAnimations();state.storyMode=true;state.movie=0;state.storyAnswer=false;state.storyMiss="";refresh();break;
 case "watch-mode":stopAnimations();state.storyMode=false;state.movie=0;state.movieEnded=false;refresh();break;
 case "next-story":stopVoice();state.movie=(state.movie+1)%scenes.length;state.storyAnswer=false;state.storyMiss="";refresh();break;
 case "chant-toggle":if(state.chantPlaying){stopAnimations();refresh();}else{if(state.chantEnded){state.chant=0;state.chantEnded=false;}state.chantPlaying=true;refresh();runChant();}break;
 case "next-chant":stopAnimations();state.chant=(state.chant+1)%chants.length;state.chantEnded=false;refresh();playVoice("chant"+state.chant);break;
 case "pair":stopVoice();state.pair=(state.pair+1)%emotions.length;refresh();break;
 case "clear-drawing":drawingImage=null;defaultFace(byId("drawCanvas"));break;
 case "exit":state.exit=!state.exit;refresh();break;
 }
});
render();
</script></body></html>
